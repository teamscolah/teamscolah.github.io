<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Today Grafana Alloy collects container logs and an OpenTelemetry Collector receives OTLP; next, Alloy may do both">
<style>
  .bg{fill:#ffffff}.box{fill:#f5f7fa;stroke:#d5dce6;stroke-width:1.5}.hl{fill:#e8effd;stroke:#2463e3;stroke-width:1.5}
  .t{font:600 19px Inter,system-ui,sans-serif;fill:#132847}.s{font:400 15px Inter,system-ui,sans-serif;fill:#53637a}.k{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;fill:#f07316}
  .ln{stroke:#8a99ad;stroke-width:1.8;fill:none}.lb{stroke:#2463e3;stroke-width:2;fill:none}.mk{fill:#8a99ad}.mkb{fill:#2463e3}
  @media (prefers-color-scheme: dark){.bg{fill:#0c1626}.box{fill:#122035;stroke:#2a3c5c}.hl{fill:#16294a;stroke:#6f9bff}.t{fill:#e8edf5}.s{fill:#a3b1c6}.k{fill:#ff8a3d}.ln{stroke:#5d6f8a}.mk{fill:#5d6f8a}.lb{stroke:#6f9bff}.mkb{fill:#6f9bff}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="mkb"/></marker></defs>
<rect class="bg" width="1200" height="380"/>
<text class="k" x="40" y="56">TODAY</text>
<rect class="hl" x="40" y="76" width="250" height="90" rx="14"/>
<text class="t" x="62" y="114">Grafana Alloy</text>
<text class="s" x="62" y="142">container logs</text>
<rect class="box" x="40" y="186" width="250" height="90" rx="14"/>
<text class="t" x="62" y="224">OTel Collector</text>
<text class="s" x="62" y="252">OTLP from apps + agents</text>
<path class="ln" d="M290 121 C340 121 340 166 388 166" marker-end="url(#a)"/>
<path class="ln" d="M290 231 C340 231 340 186 388 186" marker-end="url(#a)"/>
<rect class="box" x="390" y="116" width="180" height="120" rx="14"/>
<text class="t" x="412" y="154">Loki</text>
<text class="t" x="412" y="184">Prometheus</text>
<text class="t" x="412" y="214">Tempo</text>
<path class="ln" d="M600 176 H660" marker-end="url(#a)"/>
<text class="k" x="680" y="56">NEXT</text>
<rect class="hl" x="680" y="96" width="260" height="160" rx="16"/>
<text class="t" x="704" y="140">Grafana Alloy</text>
<text class="s" x="704" y="174">container logs, plus OTLP</text>
<text class="s" x="704" y="200">through its OpenTelemetry</text>
<text class="s" x="704" y="226">components: one agent</text>
<path class="lb" d="M940 176 H1000" marker-end="url(#b)"/>
<rect class="box" x="1002" y="116" width="160" height="120" rx="14"/>
<text class="t" x="1024" y="154">Loki</text>
<text class="t" x="1024" y="184">Prometheus</text>
<text class="t" x="1024" y="214">Tempo</text>
<text class="s" x="40" y="330">Only if Alloy matches the collector on real traffic. Apps and agents keep speaking plain OTLP either way.</text>
</svg>
